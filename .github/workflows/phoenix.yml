name: Phoenix Cloud Automation

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-cloud-automation
  cancel-in-progress: false

jobs:
  run-phoenix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip --retries 5 --timeout 30
          python -m pip install flake8 --retries 5 --timeout 30

      - name: Check Repository Integrity
        shell: bash
        run: |
          git ls-files -s > "$RUNNER_TEMP/git-index.txt"

          if grep -q '^160000 ' "$RUNNER_TEMP/git-index.txt"; then
            echo "::error::Broken nested Git repository entries detected."
            exit 1
          fi

          echo "Repository index is clean."

      - name: Lint
        run: |
          python -m flake8 contribute.py
          python -m flake8 test_contribute.py

      - name: Run Tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest test_contribute -v

      - name: Phoenix Health Check
        run: |
          python --version
          git status --short
          echo "Phoenix scheduled health check completed."
