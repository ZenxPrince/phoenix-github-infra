name: Phoenix Cloud Automation

on:
  schedule:
    # Runs EVERY HOUR at minute 0 for maximum possible contribution density
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual execution anytime

permissions:
  contents: write

jobs:
  run-phoenix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "Phoenix Automation Bot"
          git config --global user.email "actions@github.com"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          python -m unittest discover -s . -p "test_*.py"

      - name: Execute Phoenix Automation Script
        run: |
          python contribute.py

      - name: Push Generated Contributions
        run: |
          git status
          git add .
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: maximum automated contribution sync [skip ci]" && git push)
