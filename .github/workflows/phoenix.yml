name: Phoenix Cloud Automation

on:
  schedule:
    # Runs 3 times a day: 00:00, 08:00, and 16:00 UTC 
    # (Corresponding to 05:30, 13:30, and 21:30 IST)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch: # Allows manual execution from the GitHub Actions tab

jobs:
  run-phoenix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          python -m unittest discover -s . -p "test_*.py"

      - name: Execute Phoenix Automation Script
        run: |
          python contribute.py
