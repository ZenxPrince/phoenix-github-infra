name: Phoenix Cloud Automation

on:
  schedule:
    # Runs every 4 hours (6 times a day) for a rich, organic, high-density green graph
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-phoenix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Git Identity
        run: |
          git config --global user.name "Phoenix Automation Bot"
          git config --global user.email "actions@github.com"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        run: |
          python -m unittest discover -s . -p "test_*.py"

      - name: Execute Natural-Density Phoenix Automation
        run: |
          # Balanced commit count for a lush, organic, natural-looking contribution graph
          python contribute.py --max_commits=8 --frequency=80

      - name: Push Generated Contributions
        run: |
          git status
          git add .
          git diff --quiet && git diff --cached --quiet || (git commit -m "chore: natural contribution sync [skip ci]" && git push)
