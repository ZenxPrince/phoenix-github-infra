name: Phoenix Cloud Automation

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-phoenix:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Git Identity
        run: |
          git config user.name "Phoenix Automation Bot"
          git config user.email "actions@github.com"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE" python -m unittest test_contribute

      - name: Execute Phoenix Generator
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/phoenix-generator"
          cd "$RUNNER_TEMP/phoenix-generator"
          python "$GITHUB_WORKSPACE/contribute.py" --max_commits=8 --frequency=80

      - name: Commit Repository Changes
        shell: bash
        run: |
          git add -A

          if git diff --cached --quiet; then
            echo "No repository changes to commit."
            exit 0
          fi

          git commit -m "chore: Phoenix automation"
          git push
